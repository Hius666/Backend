name: Backend verification
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore DoanTrungHieu_2380600643.slnx
      - run: dotnet build DoanTrungHieu_2380600643.slnx --no-restore
      - run: dotnet run --project tests/DoanTrungHieu_2380600643.Checks --no-build
